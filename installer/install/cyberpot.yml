---
# Refactored CyberPot installer playbook
# - Consolidated distribution lists and package mappings
# - Use facts (gather_facts: true) where possible
# - Fixed conditional logic and a few bugs (openSUSE python install when-condition)
# - Improved idempotence (use package, lineinfile, cron, group/user modules)
# - Kept distro-specific actions explicit and documented

- name: CyberPot - Bootstrap and prepare system
  hosts: all
  gather_facts: true
  become: true

  vars:
    supported_dists: ["AlmaLinux", "Debian", "Fedora", "openSUSE Tumbleweed", "Raspbian", "Rocky", "Ubuntu"]
    debian_like: ["Debian", "Raspbian", "Ubuntu"]
    dnf_like: ["AlmaLinux", "Fedora", "Rocky"]
    opensuse: ["openSUSE Tumbleweed"]

    recommended_packages:
      Debian: &debian_packages
        - apache2-utils
        - bash-completion
        - ca-certificates
        - cracklib-runtime
        - cron
        - curl
        - git
        - gnupg
        - grc
        - htop
        - micro
        - net-tools
        - vim
        - wget
      Raspbian: *debian_packages
      Ubuntu: *debian_packages

      AlmaLinux: &alma_packages
        - bash-completion
        - ca-certificates
        - cracklib
        - curl
        - dnf-plugins-core
        - git
        - grc
        - htop
        - httpd-tools
        - net-tools
        - tar
        - vim
        - wget
      Rocky: *alma_packages

      Fedora:
        - bash-completion
        - ca-certificates
        - cracklib
        - cronie
        - curl
        - dnf-plugins-core
        - git
        - grc
        - htop
        - httpd-tools
        - micro
        - net-tools
        - vim
        - wget

      openSUSE:
        - apache2-utils
        - bash-completion
        - busybox-net-tools
        - ca-certificates
        - cracklib
        - curl
        - git
        - grc
        - htop
        - vim
        - wget

    docker_remove_packages:
      - docker
      - docker-engine
      - docker.io
      - containerd
      - runc
      - podman-docker
      - podman

    docker_install_packages_common:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

    openSUSE_docker_packages:
      - docker
      - docker-bash-completion
      - docker-buildx
      - docker-compose
      - docker-compose-switch
      - liblvm2cmd2_03
      - lvm2

    cyberpot_group_gid: 2000
    cyberpot_user_uid: 2000
    cyberpot_ssh_port: 64295

  pre_tasks:
    - name: Re-gather facts as unprivileged user for sanity checks (override become-gathered root facts)
      setup:
      become: false
      tags: ['sanity']

    - name: Abort if unsupported distribution
      assert:
        that:
          - ansible_distribution in supported_dists
        fail_msg: "CyberPot is not supported on this platform: {{ ansible_distribution }}"
        success_msg: "Detected supported platform: {{ ansible_distribution }}"
      become: false
      tags: ['sanity']

    - name: Abort if running as root or as reserved user 'cyberpot'
      assert:
        that:
          - ansible_user_id != 'root'
          - ansible_user_id != 'cyberpot'
        fail_msg: "Playbook must not be run as root or as the reserved user 'cyberpot' (current: {{ ansible_user_id }})"
        success_msg: "Running as user: {{ ansible_user_id }}"
      become: false
      tags: ['sanity']

  tasks:
    - name: Ensure python3 is installed (Debian/Raspbian/Ubuntu)
      package:
        name: python3
        state: present
      when: ansible_distribution in debian_like
      tags: ['bootstrap']

    - name: Ensure python3 is installed (AlmaLinux/Fedora/Rocky)
      package:
        name: python3
        state: present
      when: ansible_distribution in dnf_like
      tags: ['bootstrap']

    - name: Ensure python3 is installed (openSUSE)
      package:
        name: python3
        state: present
      when: ansible_distribution in opensuse
      tags: ['bootstrap']

    - name: Sync system clock (best-effort)
      command: hwclock --hctosys
      failed_when: false
      changed_when: false
      ignore_errors: true
      tags: ['system']

    - name: Install recommended packages for the current distribution
      package:
        name: "{{ recommended_packages[ansible_distribution] | default([]) }}"
        state: latest
        update_cache: yes
      when: recommended_packages[ansible_distribution] is defined
      tags: ['packages']

    - name: Install grc from remote RPM (AlmaLinux, Rocky)
      ansible.builtin.dnf:
        name: 'https://github.com/kriipke/grc/releases/download/1.13.8/grc-1.13.8-1.el7.noarch.rpm'
        disable_gpg_check: true
        state: present
      when: ansible_distribution in ['AlmaLinux','Rocky']
      tags: ['packages']

    - name: Download and install micro (AlmaLinux, openSUSE, Rocky)
      shell: |
        curl -fsSL https://getmic.ro | bash && mv micro /usr/local/bin/micro
      args:
        executable: /bin/bash
      when: ansible_distribution in ['AlmaLinux','openSUSE Tumbleweed','Rocky']
      tags: ['packages']

    - name: Remove distribution docker/podman packages (best-effort)
      package:
        name: "{{ docker_remove_packages }}"
        state: absent
        update_cache: yes
      tags: ['docker']

    - name: Ensure apt keyrings directory exists (Debian/Raspbian/Ubuntu)
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      when: ansible_distribution in debian_like
      tags: ['docker']

    - name: Download Docker GPG key (Debian/Raspbian/Ubuntu)
      get_url:
        url: "https://download.docker.com/linux/{{ (ansible_distribution | lower) }}/gpg"
        dest: /etc/apt/keyrings/docker.gpg
        mode: '0644'
      when: ansible_distribution in debian_like
      tags: ['docker']

    - name: Add Docker apt repository (Debian/Raspbian/Ubuntu)
      apt_repository:
        filename: docker
        repo: "deb [arch={{ ansible_architecture | replace('aarch64','arm64') | replace('x86_64','amd64') }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/{{ (ansible_distribution | lower) }} {{ ansible_distribution_release | default('stable') }} stable"
        state: present
        update_cache: yes
      when: ansible_distribution in debian_like
      tags: ['docker']

    - name: Add Docker repo for Fedora (dnf config-manager)
      shell: |
        if ! dnf repolist docker-ce-stable >/dev/null 2>&1; then
          dnf -y config-manager addrepo --from-repofile=https://download.docker.com/linux/fedora/docker-ce.repo
        fi
      when: ansible_distribution == 'Fedora'
      tags: ['docker']

    - name: Add Docker repo for AlmaLinux/Rocky (dnf config-manager)
      shell: |
        if ! dnf repolist docker-ce-stable >/dev/null 2>&1; then
          dnf -y config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
        fi
      when: ansible_distribution in ['AlmaLinux','Rocky']
      tags: ['docker']

    - name: Install Docker Engine packages (openSUSE)
      package:
        name: "{{ openSUSE_docker_packages }}"
        state: latest
        update_cache: yes
      when: ansible_distribution in opensuse
      tags: ['docker']

    - name: Install Docker Engine packages (Debian/Alma/Fedora/Raspbian/Rocky/Ubuntu)
      package:
        name: "{{ docker_install_packages_common }}"
        state: latest
        update_cache: yes
      when: ansible_distribution in supported_dists
      tags: ['docker']

    - name: Stop docker service before configuration changes (best-effort)
      service:
        name: docker
        state: stopped
        enabled: false
      ignore_errors: true
      tags: ['services']

    - name: Create cyberpot group
      group:
        name: cyberpot
        gid: "{{ cyberpot_group_gid }}"
        state: present
      tags: ['users']

    - name: Create cyberpot system user
      user:
        name: cyberpot
        uid: "{{ cyberpot_user_uid }}"
        system: yes
        shell: /bin/false
        home: /nonexistent
        group: cyberpot
        state: present
      tags: ['users']

    - name: Ensure vm.max_map_count is set
      lineinfile:
        path: /etc/sysctl.conf
        line: "vm.max_map_count=262144"
        state: present
        create: yes
      tags: ['sysctl']

    - name: Set SSH port (idempotent)
      lineinfile:
        path: "{{ '/etc/ssh/sshd_config' if ansible_distribution != 'openSUSE Tumbleweed' else '/etc/ssh/sshd_config.d/port.conf' }}"
        regexp: '^#?Port\s+'
        line: "Port {{ cyberpot_ssh_port }}"
        create: yes
      tags: ['ssh']

    - name: Add CyberPot SSH port to firewall (Firewalld systems)
      firewalld:
        port: "{{ cyberpot_ssh_port }}/tcp"
        permanent: yes
        state: enabled
      when: ansible_distribution in ['AlmaLinux','Fedora','openSUSE Tumbleweed','Rocky']
      tags: ['firewall']

    - name: Set firewalld default target to ACCEPT where applicable
      firewalld:
        zone: public
        target: ACCEPT
        permanent: yes
        state: enabled
      when: ansible_distribution in ['AlmaLinux','Fedora','openSUSE Tumbleweed','Rocky']
      tags: ['firewall']

    - name: Load iptable_filter kernel module (dnf-like)
      command: modprobe -v iptable_filter
      when: ansible_distribution in dnf_like
      tags: ['network']

    - name: Ensure iptable_filter is loaded on boot (dnf-like)
      lineinfile:
        path: /etc/modules-load.d/iptables.conf
        line: iptable_filter
        create: yes
      when: ansible_distribution in dnf_like
      tags: ['network']

    - name: Set SELinux to permissive where present
      lineinfile:
        path: /etc/selinux/config
        regexp: '^SELINUX='
        line: 'SELINUX=permissive'
      when: ansible_distribution in dnf_like
      tags: ['selinux']

    - name: Attempt to setenforce Permissive (best-effort)
      command: setenforce Permissive
      when: ansible_distribution in dnf_like
      ignore_errors: true
      tags: ['selinux']

    - name: Stop systemd-resolved (Fedora, Ubuntu) if present
      service:
        name: systemd-resolved
        state: stopped
      ignore_errors: true
      when: ansible_distribution in ['Fedora','Ubuntu']
      tags: ['network']

    - name: Ensure DNSStubListener=no in resolved.conf (Fedora, Ubuntu)
      lineinfile:
        path: /etc/systemd/resolved.conf
        regexp: '^.*DNSStubListener=.*'
        line: 'DNSStubListener=no'
        create: yes
      when: ansible_distribution in ['Fedora','Ubuntu']
      tags: ['network']

    - name: Add current user to docker and cyberpot groups
      become: true
      user:
        name: "{{ ansible_user_id }}"
        groups:
          - docker
          - cyberpot
        append: yes
      tags: ['users']

    - name: Add helpful aliases to current user's .bashrc
      blockinfile:
        path: "{{ lookup('env','HOME') }}/.bashrc"
        block: |
          alias dps='grc --colour=on docker ps -f status=running -f status=exited --format "table {{'{{'}}.Names{{'}}'}}\t{{'{{'}}.Status{{'}}'}}\t{{'{{'}}.Ports{{'}}'}}" | sort'
          alias dpsw='watch -c bash -ic dps'
          alias mi='micro'
          alias sudo='sudo '
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        insertafter: EOF
      tags: ['users']

    - name: Clone CyberPot repository for the current user (only if absent)
      git:
        repo: 'https://github.com/khulnasoft/cyberpot'
        dest: '/home/{{ ansible_user_id }}/cyberpot'
        version: master
        update: no
        force: no
      become: false
      tags: ['repo']

    - name: Install systemd service file from repository
      become: true
      ansible.builtin.template:
        src: '{{ playbook_dir }}/cyberpot.service'
        dest: '/etc/systemd/system/cyberpot.service'
        owner: root
        group: root
        mode: '0755'
      notify: Reload systemd and enable cyberpot
      tags: ['service']

    - name: Setup a randomized daily reboot cron job
      cron:
        name: "CyberPot Daily Reboot"
        user: root
        minute: "{{ range(0,60) | random }}"
        hour: "{{ range(0,5) | random }}"
        job: "bash -c 'systemctl stop cyberpot.service && docker container prune -f && docker image prune -f && docker volume prune -f && /usr/sbin/shutdown -r +1 \"CyberPot Daily Reboot\"'"
        state: present
      tags: ['cron']

  handlers:
    - name: Reload systemd and enable cyberpot
      become: true
      ansible.builtin.systemd:
        name: cyberpot.service
        daemon_reload: yes
        state: restarted
        enabled: yes
      ignore_errors: true
      tags: ['service']

- name: CyberPot - Restart and report services
  hosts: all
  gather_facts: true
  become: true
  vars:
    supported_dists: ["AlmaLinux", "Debian", "Fedora", "openSUSE Tumbleweed", "Raspbian", "Rocky", "Ubuntu"]
  tasks:
    - name: Restart systemd-resolved where applicable
      service:
        name: systemd-resolved
        state: restarted
      ignore_errors: true
      when: ansible_distribution in ['Fedora','Ubuntu']

    - name: Restart firewalld where applicable
      service:
        name: firewalld
        state: restarted
      when: ansible_distribution in ['AlmaLinux','Fedora','openSUSE Tumbleweed','Rocky']

    - name: Print firewall rules (if firewalld present)
      command: firewall-cmd --list-all
      register: firewall_output
      when: ansible_distribution in ['AlmaLinux','Fedora','openSUSE Tumbleweed','Rocky']
      ignore_errors: true

    - name: Show Firewall rules
      debug:
        var: firewall_output.stdout_lines
      when: firewall_output is defined

    - name: Enable and restart docker service
      service:
        name: docker
        state: restarted
        enabled: true
      when: ansible_distribution in supported_dists
      ignore_errors: true

    - name: Restart ssh service
      service:
        name: "{{ 'ssh' if ansible_distribution == 'Ubuntu' else 'sshd' }}"
        state: restarted
        enabled: true
      register: ssh_restart_result
      failed_when: false
      ignore_errors: true