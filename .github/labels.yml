# GitHub labels for CyberPot — PR specify
# Managed via https://github.com/marketplace/actions/github-labeler or `gh label create`
# Usage: `gh label create --force -f .github/labels.yml` with `github-label-sync`

# PR Types (specify)
- name: "pr:bug"
  color: "d73a4a"
  description: "Bug fix PR"
- name: "pr:feature"
  color: "0e8a16"
  description: "New feature PR"
- name: "pr:enhancement"
  color: "a2eeef"
  description: "Enhancement / improvement"
- name: "pr:documentation"
  color: "0075ca"
  description: "Documentation only"
- name: "pr:security"
  color: "b60205"
  description: "Security fix"
- name: "pr:dependencies"
  color: "0366d6"
  description: "Dependency update"
- name: "pr:ci"
  color: "ededed"
  description: "CI / workflow"
- name: "pr:chore"
  color: "fef2c0"
  description: "Chore / refactoring"

# PR Areas (specify)
- name: "area:docker"
  color: "1d76db"
  description: "Docker / honeypot images"
- name: "area:compose"
  color: "0e8a16"
  description: "Compose templates"
- name: "area:installer"
  color: "c5def5"
  description: "Installer / ansible"
- name: "area:scripts"
  color: "d4c5f9"
  description: "Scripts / helper tooling"
- name: "area:docs"
  color: "0075ca"
  description: "Documentation"
- name: "area:elk"
  color: "5319e7"
  description: "ELK / Elasticsearch / Kibana / Logstash"
- name: "area:devcontainer"
  color: "c2e0c6"
  description: "Devcontainer / dev env"

# PR Priority / Specify
- name: "priority:high"
  color: "b60205"
  description: "High priority"
- name: "priority:medium"
  color: "fbca04"
  description: "Medium priority"
- name: "priority:low"
  color: "0e8a16"
  description: "Low priority"

# Existing repo labels (keep)
- name: "no basic support info"
  color: "d93f0b"
  description: "Missing basic support info"
- name: "stale"
  color: "ededed"
  description: "Stale issue/PR"
- name: "keep-open"
  color: "0e8a16"
  description: "Exempt from stale"
